<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Reisezeit" />
  <title>viacruz Reisezeit</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=0.2.5-r1" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">viacruz <span>Reisezeit</span></div>
        <div class="tagline">Deine Orte. Deine Reisen.</div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen">⚙︎</button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Start</small></button>
      <button data-route="camping" class="nav-item"><span>△</span><small>Campingplätze</small></button>
      <button data-route="stellplatz" class="nav-item"><span>▣</span><small>Stellplätze</small></button>
      <button data-route="urlaub" class="nav-item"><span>◇</span><small>Urlaub</small></button>
      <button data-route="search" class="nav-item"><span>⌕</span><small>Suche</small></button>
    </nav>
  </div>

  <dialog id="entryDialog" class="sheet">
    <form method="dialog" id="entryForm" class="sheet-card">
      <div class="sheet-head">
        <div>
          <div class="eyebrow">Schnelleingabe</div>
          <h2>Neuen Ort speichern</h2>
        </div>
        <button class="icon-btn close" value="cancel" aria-label="Schließen">×</button>
      </div>

      <label>Typ
        <select id="entryType" required>
          <option value="camping">Campingplatz</option>
          <option value="stellplatz">Stellplatz</option>
          <option value="hotel">Hotel</option>
          <option value="ferien">Ferienwohnung/Ferienhaus</option>
          <option value="besonders">Besondere Unterkunft</option>
          <option value="reiseziel">Reiseziel/Ausflugsziel</option>
        </select>
      </label>

      <label>Name
        <input id="entryName" autocomplete="off" required placeholder="z. B. Camping Seeblick" />
      </label>

      <div class="grid-2">
        <label>Land
          <input id="entryCountry" autocomplete="country-name" placeholder="z. B. Italien" />
        </label>
        <label>Region/Gebiet
          <input id="entryRegion" autocomplete="off" placeholder="z. B. Gardasee" />
        </label>
      </div>

      <div class="grid-2">
        <label>Quelle
          <select id="entrySourceType">
            <option value="">Nicht angegeben</option>
            <option value="Instagram">Instagram</option>
            <option value="Google">Google</option>
            <option value="Facebook">Facebook</option>
            <option value="YouTube">YouTube</option>
            <option value="Campingportal">Campingportal</option>
            <option value="Empfehlung">Empfehlung</option>
            <option value="Zeitschrift">Zeitschrift</option>
            <option value="Sonstige">Sonstige</option>
          </select>
        </label>
        <label>Link zur Quelle
          <input id="entrySourceUrl" type="url" inputmode="url" autocomplete="url" placeholder="https:// …" />
        </label>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn secondary" id="cancelEntry">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="sheet">
    <div class="sheet-card detail-sheet" id="detailContent"></div>
  </dialog>


  <dialog id="campingEditDialog" class="sheet edit-sheet-dialog">
    <form method="dialog" id="campingEditForm" class="sheet-card edit-sheet-card">
      <div class="sheet-head sticky-sheet-head">
        <div>
          <div class="eyebrow">Campingplatz bearbeiten</div>
          <h2>Grunddaten & Saison</h2>
        </div>
        <button type="button" class="icon-btn close" id="closeCampingEdit" aria-label="Schließen">×</button>
      </div>

      <input type="hidden" id="campingEditId" />

      <section class="edit-section">
        <div class="edit-section-head">
          <h3>Grunddaten</h3>
          <p>Allgemeine Angaben zum Campingplatz.</p>
        </div>

        <label>Name
          <input id="campingName" required autocomplete="off" />
        </label>

        <div class="grid-2">
          <label>Land
            <input id="campingCountry" autocomplete="country-name" placeholder="z. B. Italien" />
          </label>
          <label>Region/Bundesland
            <input id="campingRegion" autocomplete="off" placeholder="z. B. Lombardei" />
          </label>
        </div>

        <label>Gebiet/Reiseregion
          <input id="campingTravelRegions" autocomplete="off" placeholder="z. B. Gardasee, Norditalien" />
          <span class="field-help">Mehrere Zuordnungen durch Komma trennen.</span>
        </label>

        <div class="grid-2">
          <label>Ort
            <input id="campingTown" autocomplete="address-level2" />
          </label>
          <label>Adresse
            <input id="campingAddress" autocomplete="street-address" />
          </label>
        </div>

        <div class="grid-2">
          <label>Quelle
            <select id="campingSourceType">
              <option value="">Nicht angegeben</option>
              <option value="Instagram">Instagram</option>
              <option value="Google">Google</option>
              <option value="Facebook">Facebook</option>
              <option value="YouTube">YouTube</option>
              <option value="Campingportal">Campingportal</option>
              <option value="Empfehlung">Empfehlung</option>
              <option value="Zeitschrift">Zeitschrift</option>
              <option value="Sonstige">Sonstige</option>
            </select>
          </label>
          <label>Link zur Quelle
            <input id="campingSourceUrl" type="url" inputmode="url" autocomplete="url" placeholder="https:// …" />
          </label>
        </div>

        <div class="grid-2">
          <label>Telefon
            <input id="campingPhone" type="text" inputmode="tel" autocomplete="tel" placeholder="+49 …" />
          </label>
          <label>E-Mail
            <input id="campingEmail" type="email" autocomplete="email" />
          </label>
        </div>
      </section>

      <section class="edit-section">
        <div class="edit-section-head">
          <h3>Saison & Aufenthalt</h3>
          <p>Öffnungszeiten, Reservierung und An-/Abreise.</p>
        </div>

        <label>Betriebsart
          <select id="campingOperationType">
            <option value="unknown">Unbekannt</option>
            <option value="year-round">Ganzjährig</option>
            <option value="seasonal">Saisonal</option>
          </select>
        </label>

        <div class="grid-2 seasonal-fields" id="campingSeasonDates">
          <label>Geöffnet von
            <input id="campingOpenFrom" type="date" />
          </label>
          <label>Geöffnet bis
            <input id="campingOpenTo" type="date" />
          </label>
        </div>

        <div class="grid-2">
          <label>Sommercamping
            <select id="campingSummer">
              <option value="unknown">Unbekannt</option>
              <option value="yes">Möglich</option>
              <option value="no">Nicht möglich</option>
            </select>
          </label>
          <label>Wintercamping
            <select id="campingWinter">
              <option value="unknown">Unbekannt</option>
              <option value="yes">Möglich</option>
              <option value="no">Nicht möglich</option>
            </select>
          </label>
        </div>

        <div class="grid-2">
          <label>Mindestaufenthalt (Nächte)
            <input id="campingMinStay" type="number" min="1" inputmode="numeric" placeholder="optional" />
          </label>
          <label>Reservierung
            <select id="campingReservation">
              <option value="unknown">Unbekannt</option>
              <option value="not-needed">Nicht nötig</option>
              <option value="possible">Möglich</option>
              <option value="recommended">Empfohlen</option>
              <option value="required">Erforderlich</option>
            </select>
          </label>
        </div>

        <label>Spontane Anreise
          <select id="campingSpontaneous">
            <option value="unknown">Unbekannt</option>
            <option value="yes">Möglich</option>
            <option value="no">Nicht möglich</option>
          </select>
        </label>

        <div class="grid-2">
          <label>Anreise von
            <input id="campingArrivalFrom" type="time" />
          </label>
          <label>Anreise bis
            <input id="campingArrivalTo" type="time" />
          </label>
        </div>

        <div class="grid-2">
          <label>Abreise von
            <input id="campingDepartureFrom" type="time" />
          </label>
          <label>Abreise bis
            <input id="campingDepartureTo" type="time" />
          </label>
        </div>

        <label>Besondere Hinweise
          <textarea id="campingSeasonNotes" rows="4" placeholder="z. B. Mittagsruhe, späteste Schrankenöffnung …"></textarea>
        </label>
      </section>

      <div class="sheet-actions sticky-sheet-actions">
        <button type="button" class="btn secondary" id="cancelCampingEdit">Abbrechen</button>
        <button type="submit" class="btn primary">Änderungen speichern</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=0.2.5-r1"></script>
</body>
</html>
